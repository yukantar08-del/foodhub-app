name: Build FoodHub APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Find Flutter project
        run: |
          echo "Isi repository:"
          ls -la
          echo "Mencari pubspec.yaml:"
          find . -name pubspec.yaml -not -path './.git/*'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-APK
          path: build/app/outputs/flutter-apk/app-release.apk
